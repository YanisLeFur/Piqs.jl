name: Documentation

on:
  push:
    branches:
      - main
    tags: ['*']  # builds the "stable" docs for each release tagged by TagBot

permissions:
  contents: write
  actions: write  # lets julia-actions/cache clean up old caches

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'  # latest stable release

      - uses: julia-actions/cache@v2

      - name: Install dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(path=".")
            Pkg.instantiate()
          '

      - name: Build and deploy docs
        run: julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  
